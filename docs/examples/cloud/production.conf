# Shared Detent Cloud production ingress. Install only after provider configuration
# and entry/tenant public_url migration; see ../../cloud-domain-migration.md.
server {
    listen 80;
    server_name cloud.detent.build;
    return 308 https://cloud.detent.build$request_uri;
}

server {
    listen 443 ssl;
    server_name cloud.detent.build;
    ssl_certificate /etc/letsencrypt/live/cloud.detent.build/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.detent.build/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Jarvis shared bot policy; runner API rate limiting remains disabled.
    include /etc/nginx/snippets/security-default.conf;
    client_max_body_size 100m;

    # The entry decides which browser navigations to redirect. Keep the legacy
    # Host for callback cookies and same-origin checks, and every URI/body intact.
    location / {
        proxy_pass http://127.0.0.1:8017;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $detent_cloud_connection;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

