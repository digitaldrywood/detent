version: "2"
sql:
  - engine: "postgresql"
    queries: "queries"
    schema: ["roles.sql", "migrations"]
    gen:
      go:
        package: "pgquery"
        out: "pgquery"
        sql_package: "pgx/v5"
        emit_empty_slices: true
        rename:
          payload_sha256: "PayloadSHA256"
          head_sha: "HeadSHA"
          base_sha: "BaseSHA"
          merge_base_sha: "MergeBaseSHA"
          landed_head_sha: "LandedHeadSHA"
          landed_merge_sha: "LandedMergeSHA"
          external_url: "ExternalURL"
          landing_head_sha: "LandingHeadSHA"
        overrides:
          - db_type: "json"
            nullable: false
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "json"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: false
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "jsonb"
            nullable: true
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "tsvector"
            go_type: "string"
          - db_type: "tsquery"
            go_type: "string"
          - column: "search_documents.project_id"
            go_type:
              import: "github.com/digitaldrywood/detent/internal/tracker"
              type: "ProjectID"
              pointer: true
          - column: "hosted_work_views.project_id"
            go_type:
              import: "github.com/digitaldrywood/detent/internal/tracker"
              type: "ProjectID"
              pointer: true
          - db_type: "text"
            nullable: true
            go_type:
              type: "string"
              pointer: true
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - column: "*.organization_id"
            go_type:
              import: "github.com/digitaldrywood/detent/internal/tracker"
              type: "OrganizationID"
          - column: "projects.id"
            go_type:
              import: "github.com/digitaldrywood/detent/internal/tracker"
              type: "ProjectID"
          - column: "*.project_id"
            go_type:
              import: "github.com/digitaldrywood/detent/internal/tracker"
              type: "ProjectID"
          - column: "issues.native_id"
            go_type:
              import: "github.com/digitaldrywood/detent/internal/tracker"
              type: "NativeWorkItemID"
          - column: "issues.priority"
            go_type:
              type: "int"
              pointer: true
          - column: "issues.doctor_identity_revision"
            go_type:
              type: "int64"
              pointer: true
          - column: "native_comments.work_item_id"
            go_type:
              import: "github.com/digitaldrywood/detent/internal/tracker"
              type: "NativeWorkItemID"
          - column: "collaboration_events.work_item_id"
            go_type:
              import: "github.com/digitaldrywood/detent/internal/tracker"
              type: "NativeWorkItemID"
          - column: "collaboration_versions.work_item_id"
            go_type:
              import: "github.com/digitaldrywood/detent/internal/tracker"
              type: "NativeWorkItemID"
          - column: "change_requests.work_item_id"
            go_type:
              import: "github.com/digitaldrywood/detent/internal/tracker"
              type: "NativeWorkItemID"
          - column: "change_issue_links.work_item_id"
            go_type:
              import: "github.com/digitaldrywood/detent/internal/tracker"
              type: "NativeWorkItemID"
