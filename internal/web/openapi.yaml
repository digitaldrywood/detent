openapi: 3.0.3
info:
  title: Detent Stable JSON API
  version: 1.0.0
  description: |
    The stable, machine-readable JSON API for Detent operators and integrations.
    Dashboard HTML, HTMX fragments, and server-sent event streams are outside this
    catalog. Some cataloged operations also support an HTMX representation; this
    document describes only their non-HTMX JSON contract. All operations except
    discovery are registered only while Detent is in running mode.
servers:
  - url: /
tags:
  - name: discovery
  - name: telemetry
  - name: projects
  - name: operations
  - name: administration
  - name: webhooks
paths:
  /api/v1/openapi.yaml:
    get:
      operationId: getOpenAPI
      summary: Download this OpenAPI document
      tags: [discovery]
      security: []
      x-detent-access: public
      x-detent-echo-path: /api/v1/openapi.yaml
      responses:
        "200":
          description: The deterministic OpenAPI 3 document.
          content:
            application/vnd.oai.openapi+yaml:
              schema:
                type: string
  /api/v1/state:
    get:
      operationId: getFleetState
      summary: Get the fleet telemetry snapshot
      tags: [telemetry]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: read
      x-detent-scope: read
      x-detent-echo-path: /api/v1/state
      responses:
        "200":
          description: Fleet state, or a degraded snapshot-unavailable response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/State"
                  - $ref: "#/components/schemas/SnapshotUnavailable"
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "429": {$ref: "#/components/responses/Problem"}
  /api/v1/demo/scenarios:
    get:
      operationId: listDemoScenarios
      summary: List enabled deterministic demo scenarios
      tags: [telemetry]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: read
      x-detent-scope: read
      x-detent-echo-path: /api/v1/demo/scenarios
      responses:
        "200":
          description: Demo scenario manifest.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenericObject"}
        "404":
          description: Demo mode is not enabled.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/timeseries:
    get:
      operationId: getFleetTimeSeries
      summary: Get fleet time-series samples
      tags: [telemetry]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: read
      x-detent-scope: read
      x-detent-echo-path: /api/v1/timeseries
      parameters:
        - $ref: "#/components/parameters/Window"
        - $ref: "#/components/parameters/Bucket"
      responses:
        "200":
          description: Fleet time-series samples.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TimeSeries"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
  /api/v1/operator-tools/{tool_name}:
    parameters:
      - in: path
        name: tool_name
        required: true
        description: Name from the shared read-only operator tool catalog.
        schema: {type: string, minLength: 1}
    post:
      operationId: callReadOnlyOperatorTool
      summary: Call a shared read-only operator tool
      description: Executes only tools in the shared read-only catalog against the daemon's live read model. The POST body contains the tool arguments and cannot dispatch dashboard proposal mutations.
      tags: [telemetry, operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: read
      x-detent-scope: read
      x-detent-echo-path: /api/v1/operator-tools/:tool_name
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GenericObject"}
      responses:
        "200":
          description: Exact structured result produced by the shared operator tool executor.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenericObject"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "413": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/projects/{project_id}/work-items:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      operationId: createProjectWorkItem
      summary: Create a runtime work item
      tags: [projects]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: project-scoped
      x-detent-scope: write
      x-detent-project-parameter: project_id
      x-detent-echo-path: /api/v1/projects/:project_id/work-items
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/WorkItemRequest"}
      responses:
        "201":
          description: Work item created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkItem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "501": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/projects/{project_id}/state:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: getProjectState
      summary: Get a project telemetry snapshot
      tags: [projects, telemetry]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: read
      x-detent-scope: read
      x-detent-echo-path: /api/v1/projects/*
      responses:
        "200":
          description: Project state, or a degraded snapshot-unavailable response.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/State"
                  - $ref: "#/components/schemas/SnapshotUnavailable"
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/projects/{project_id}/issues/explanation:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    get:
      operationId: getIssueExplanation
      summary: Explain an issue's current orchestration state
      description: Returns the versioned issue explanation read model, including degraded source states when live evidence is unavailable.
      tags: [projects, telemetry]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: read
      x-detent-scope: read
      x-detent-echo-path: /api/v1/projects/:project_id/issues/explanation
      parameters:
        - in: query
          name: reference
          required: true
          description: Issue ID, canonical identifier, issue URL, bare number, or hash-prefixed number.
          schema: {type: string, minLength: 1}
        - in: query
          name: schema
          description: Requested response schema version. Omit to use the current version.
          schema: {type: integer, enum: [3]}
      responses:
        "200":
          description: Versioned issue explanation, possibly containing degraded or last-known evidence.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssueExplanation"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      operationId: acknowledgeIssueParks
      summary: Acknowledge an issue's current park sequence
      description: Records the current cumulative park position and returns the versioned issue explanation model.
      tags: [projects, telemetry]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: project-scoped
      x-detent-scope: write
      x-detent-project-parameter: project_id
      x-detent-echo-path: /api/v1/projects/:project_id/issues/explanation
      parameters:
        - in: query
          name: reference
          required: true
          description: Issue ID, canonical identifier, issue URL, bare number, or hash-prefixed number.
          schema: {type: string, minLength: 1}
        - in: query
          name: schema
          description: Requested response schema version. Omit to use the current version.
          schema: {type: integer, enum: [3]}
      responses:
        "200":
          description: Issue explanation with the acknowledged park sequence updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssueExplanation"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/projects/{project_id}/issues/progress-credit:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      operationId: creditIssueProgress
      summary: Credit accepted progress for an issue
      description: Resets spend-since-progress counters by recording an operator-approved baseline.
      tags: [projects, operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: project-scoped
      x-detent-scope: write
      x-detent-project-parameter: project_id
      x-detent-echo-path: /api/v1/projects/:project_id/issues/progress-credit
      parameters:
        - in: query
          name: reference
          required: true
          description: Issue ID, canonical identifier, issue URL, bare number, or hash-prefixed number.
          schema: {type: string, minLength: 1}
        - in: query
          name: schema
          description: Requested issue-resolution schema version. Omit to use the current version.
          schema: {type: integer, enum: [3]}
      responses:
        "200":
          description: Recorded issue progress credit.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssueProgressCredit"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/projects/{project_id}/staleness-warnings/acknowledge:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
    post:
      operationId: acknowledgeStalenessWarnings
      summary: Dismiss an explicit set of active staleness warning conditions
      description: Acknowledges only the warning IDs supplied by the caller in one transactional operation.
      tags: [projects, operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: project-scoped
      x-detent-scope: write
      x-detent-project-parameter: project_id
      x-detent-echo-path: /api/v1/projects/:project_id/staleness-warnings/acknowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [warning_ids]
              properties:
                warning_ids:
                  type: array
                  minItems: 1
                  items: {type: string, minLength: 1}
      responses:
        "200":
          description: The explicit warning conditions were acknowledged.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenericObject"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/projects/{project_id}/staleness-warnings/{warning_id}/acknowledge:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - in: path
        name: warning_id
        required: true
        schema: {type: string, minLength: 1}
    post:
      operationId: acknowledgeStalenessWarning
      summary: Dismiss an active staleness warning condition
      tags: [projects, operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: project-scoped
      x-detent-scope: write
      x-detent-project-parameter: project_id
      x-detent-echo-path: /api/v1/projects/:project_id/staleness-warnings/:warning_id/acknowledge
      responses:
        "200":
          description: The warning condition was acknowledged.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenericObject"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/projects/{project_id}/timeseries:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/Window"
      - $ref: "#/components/parameters/Bucket"
    get:
      operationId: getProjectTimeSeries
      summary: Get project time-series samples
      tags: [projects, telemetry]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: read
      x-detent-scope: read
      x-detent-echo-path: /api/v1/projects/*
      responses:
        "200":
          description: Project time-series samples.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TimeSeries"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/projects/{project_id}/work-attempts/{attempt_id}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/AttemptID"
    get:
      operationId: getWorkAttempt
      summary: Get a persisted work-attempt receipt
      tags: [projects, operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: read
      x-detent-scope: read
      x-detent-echo-path: /api/v1/projects/:project_id/work-attempts/:attempt_id
      responses:
        "200":
          description: Work-attempt receipt.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkAttempt"}
        "400": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/projects/{project_id}/work-attempts/{attempt_id}/recovery:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/AttemptID"
    post:
      operationId: recoverWorkAttempt
      summary: Apply a confirmed work-attempt recovery action
      tags: [projects, operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: project-scoped
      x-detent-scope: write
      x-detent-project-parameter: project_id
      x-detent-echo-path: /api/v1/projects/:project_id/work-attempts/:attempt_id/recovery
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecoveryRequest"}
      responses:
        "200":
          description: Recovery result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenericObject"}
        "400": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/projects/{project_id}/runs/{attempt}/stop:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - $ref: "#/components/parameters/Attempt"
    post:
      operationId: stopProjectRun
      summary: Stop an active run and continue board routing
      tags: [projects, operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: project-scoped
      x-detent-scope: write
      x-detent-project-parameter: project_id
      x-detent-echo-path: /api/v1/projects/:project_id/runs/:attempt/stop
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/StopRunRequest"}
      responses:
        "200":
          description: Stop result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenericObject"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/keys:
    get:
      operationId: listAPIKeys
      summary: List API key metadata
      tags: [administration]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: admin
      x-detent-scope: admin
      x-detent-echo-path: /api/v1/keys
      responses:
        "200":
          description: API key metadata. Secret key values are never returned.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/APIKeyList"}
        "403": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
    post:
      operationId: createAPIKey
      summary: Create an API key
      tags: [administration]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: admin
      x-detent-scope: admin
      x-detent-echo-path: /api/v1/keys
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/APIKeyCreateRequest"}
      responses:
        "201":
          description: API key metadata plus the one-time token value.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/APIKeyCreated"}
        "403": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/keys/{id}/rotate:
    parameters:
      - $ref: "#/components/parameters/APIKeyID"
    post:
      operationId: rotateAPIKey
      summary: Rotate an API key
      tags: [administration]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: admin
      x-detent-scope: admin
      x-detent-echo-path: /api/v1/keys/:id/rotate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grace: {type: string, example: 24h}
      responses:
        "201":
          description: Replacement key metadata and one-time token value.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/APIKeyCreated"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
  /api/v1/keys/{id}:
    parameters:
      - $ref: "#/components/parameters/APIKeyID"
    delete:
      operationId: revokeAPIKey
      summary: Revoke an API key
      tags: [administration]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: admin
      x-detent-scope: admin
      x-detent-echo-path: /api/v1/keys/:id
      responses:
        "204": {description: API key revoked.}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/refresh:
    get:
      operationId: rejectRefreshGET
      summary: Report that refresh requires POST
      tags: [operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: read
      x-detent-scope: read
      x-detent-echo-path: /api/v1/refresh
      responses:
        "405": {$ref: "#/components/responses/Problem"}
    post:
      operationId: requestRefresh
      summary: Request an orchestrator refresh
      tags: [operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: write
      x-detent-scope: write
      x-detent-echo-path: /api/v1/refresh
      responses:
        "202":
          description: Refresh accepted or coalesced.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Refresh"}
        "429":
          description: Refresh refused by a degraded upstream rate-limit state.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Refresh"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/update/apply:
    post:
      operationId: applyUpdate
      summary: Apply a pending Detent update
      tags: [administration]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: admin
      x-detent-scope: admin
      x-detent-echo-path: /api/v1/update/apply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: {type: boolean}
      responses:
        "202":
          description: Update application started.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/capacity/clear:
    post:
      operationId: clearCapacityOutages
      summary: Clear recorded backend-capacity outages
      tags: [administration]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: admin
      x-detent-scope: admin
      x-detent-echo-path: /api/v1/capacity/clear
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                project_id: {type: string}
                scope: {type: string}
      responses:
        "200":
          description: Capacity outage records cleared.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/projects/{project_id}/security-audits/dispositions:
    post:
      operationId: recordSecurityAuditDisposition
      summary: Record an evidenced false-positive disposition for an exact-head trusted audit
      tags: [administration]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: admin
      x-detent-scope: admin
      x-detent-echo-path: /api/v1/projects/:project_id/security-audits/dispositions
      parameters:
        - {$ref: "#/components/parameters/ProjectID"}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: "#/components/schemas/SecurityAuditDispositionRequest"}
          application/json:
            schema: {$ref: "#/components/schemas/SecurityAuditDispositionRequest"}
      responses:
        "201":
          description: Immutable disposition recorded by the trusted Detent service.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SecurityAuditDisposition"}
        "404": {$ref: "#/components/responses/Problem"}
        "409": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "428": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/tracker/availability/clear:
    post:
      operationId: clearTrackerAvailability
      summary: Clear recorded tracker-availability conditions
      tags: [administration]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: admin
      x-detent-scope: admin
      x-detent-echo-path: /api/v1/tracker/availability/clear
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                project_id: {type: string}
      responses:
        "200":
          description: Tracker availability records cleared.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/forge/availability/clear:
    post:
      operationId: clearForgeAvailability
      summary: Clear recorded forge-write availability conditions
      tags: [administration]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: admin
      x-detent-scope: admin
      x-detent-echo-path: /api/v1/forge/availability/clear
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                project_id: {type: string}
                host: {type: string}
      responses:
        "200":
          description: Forge availability records cleared.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/failure-breaker/canary:
