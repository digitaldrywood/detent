      tags: [administration]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: admin
      x-detent-scope: admin
      x-detent-echo-path: /api/v1/failure-breaker/canary
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                project_id: {type: string}
      responses:
        "200":
          description: Canary request result.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/webhooks/github:
    post:
      operationId: receiveGitHubWebhook
      summary: Receive a signed GitHub webhook
      tags: [webhooks]
