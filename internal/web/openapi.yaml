        - in: header
          name: X-GitHub-Delivery
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GenericObject"}
      responses:
        "202":
          description: Webhook accepted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Refresh"}
        "400": {$ref: "#/components/responses/Problem"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/intake/{project_id}/{source}:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - in: path
        name: source
        required: true
        schema: {type: string}
    post:
      operationId: receiveProjectIntake
      summary: Receive a project intake webhook
      tags: [projects, webhooks]
      security:
        - intakeToken: []
        - intakeBearer: []
      x-detent-access: project-scoped
      x-detent-project-parameter: project_id
      x-detent-echo-path: /api/v1/intake/:project_id/:source
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/GenericObject"}
      responses:
        "200":
          description: Matching existing intake item processed.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntakeResult"}
        "201":
          description: Matching intake item created.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntakeResult"}
        "202":
          description: Valid payload did not match the configured intake source.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IntakeResult"}
        "401": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "422": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
        "503": {$ref: "#/components/responses/Unavailable"}
  /api/v1/usage:
    get:
      operationId: getUsage
      summary: Get usage aggregates
      tags: [telemetry]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: read
      x-detent-scope: read
      x-detent-echo-path: /api/v1/usage
      parameters:
        - in: query
          name: by
          schema: {type: string, enum: [day, project, issue, pr, model]}
        - in: query
          name: from
          schema: {type: string, format: date}
        - in: query
          name: to
          schema: {type: string, format: date}
      responses:
        "200":
          description: Usage report.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenericObject"}
        "400": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /api/v1/workflow/timeline:
    get:
      operationId: getWorkflowTimeline
      summary: Get persisted workflow phase events for an issue
      tags: [operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: read
      x-detent-scope: read
      x-detent-echo-path: /api/v1/workflow/timeline
      parameters:
        - in: query
          name: project_id
          required: true
          schema: {type: string}
        - in: query
          name: issue_id
          schema: {type: string}
        - in: query
          name: identifier
          schema: {type: string}
        - in: query
          name: issue_url
          schema: {type: string, format: uri}
      responses:
        "200":
          description: Ordered workflow events.
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items: {$ref: "#/components/schemas/GenericObject"}
        "400": {$ref: "#/components/responses/Problem"}
        "500": {$ref: "#/components/responses/Problem"}
  /api/v1/projects/{project_id}/issues/{issue_id}/priority:
    parameters:
      - $ref: "#/components/parameters/ProjectID"
      - in: path
        name: issue_id
        required: true
        schema: {type: string}
    post:
      operationId: setIssuePriority
      summary: Set a configured issue priority
      tags: [projects, operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: project-scoped
      x-detent-scope: write
      x-detent-project-parameter: project_id
      x-detent-echo-path: /api/v1/projects/:project_id/issues/:issue_id/priority
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [priority]
              properties:
                priority: {type: string}
      responses:
        "200":
          description: Priority updated.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "422": {$ref: "#/components/responses/Problem"}
        "501": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
  /api/v1/kanban/comment:
    post:
      operationId: createKanbanComment
      summary: Create an issue or pull-request comment
      tags: [operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: project-scoped
      x-detent-scope: write
      x-detent-project-parameter: project_id
      x-detent-echo-path: /api/v1/kanban/comment
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: "#/components/schemas/KanbanCommentRequest"}
      responses:
        "200":
          description: Comment submitted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
        "502": {$ref: "#/components/responses/Problem"}
    delete:
      operationId: deleteKanbanComment
      summary: Delete a local Detent issue comment
      tags: [operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: project-scoped
      x-detent-scope: write
      x-detent-project-parameter: project_id
      x-detent-echo-path: /api/v1/kanban/comment
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: "#/components/schemas/KanbanCommentMutation"}
      responses:
        "200":
          description: Comment deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/kanban/comment/edit:
    post:
      operationId: editKanbanComment
      summary: Edit a local Detent issue comment
      tags: [operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: project-scoped
      x-detent-scope: write
      x-detent-project-parameter: project_id
      x-detent-echo-path: /api/v1/kanban/comment/edit
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: {$ref: "#/components/schemas/KanbanCommentMutation"}
      responses:
        "200":
          description: Comment edited.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Status"}
        "400": {$ref: "#/components/responses/Problem"}
        "403": {$ref: "#/components/responses/Problem"}
        "404": {$ref: "#/components/responses/Problem"}
  /api/v1/{issue}:
    parameters:
      - in: path
        name: issue
        required: true
        description: Issue identifier captured by the final API wildcard, for example owner/repository#1642.
        allowReserved: true
        schema: {type: string, minLength: 1}
    get:
      operationId: getIssue
      summary: Get a running, retrying, or blocked issue
      tags: [operations]
      security:
        - bearerAuth: []
        - apiKeyAuth: []
      x-detent-access: read
      x-detent-scope: read
      x-detent-echo-path: /api/v1/*
      responses:
        "200":
          description: Issue runtime detail.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/GenericObject"}
        "404": {$ref: "#/components/responses/Problem"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Detent static API token or scoped API key.
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    githubSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: HMAC-SHA256 signature over the exact request body.
    intakeToken:
      type: apiKey
      in: header
      name: X-Detent-Intake-Token
    intakeBearer:
      type: http
      scheme: bearer
      description: Project intake secret, distinct from Detent API tokens and API keys.
  parameters:
    ProjectID:
      in: path
      name: project_id
      required: true
      schema: {type: string, minLength: 1}
    AttemptID:
      in: path
      name: attempt_id
      required: true
      schema: {type: integer, format: int64, minimum: 1}
    Attempt:
      in: path
      name: attempt
      required: true
      schema: {type: integer, minimum: 0}
    APIKeyID:
      in: path
      name: id
      required: true
      schema: {type: string, minLength: 1}
    Window:
      in: query
      name: window
      schema: {type: string, example: 10m}
    Bucket:
      in: query
      name: bucket
      schema: {type: string, example: 1m}
  responses:
    Problem:
      description: Request failed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Problem"}
    Unavailable:
      description: A required orchestrator or backing service is degraded or unavailable.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Problem"}
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    APIError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string}
            message: {type: string}
    CLIProblem:
      type: object
      description: RFC 9457-style Detent CLI JSON error envelope documented in docs/cli.md.
      required: [type, code, title, detail, exit_code]
      properties:
        type: {type: string, format: uri}
        code: {type: string}
        title: {type: string}
        detail: {type: string}
        exit_code: {type: integer}
        suggested_fix: {type: string}
        did_you_mean:
          type: array
          items: {type: string}
        docs_url: {type: string, format: uri}
    Problem:
      description: Stable Detent machine-error forms. HTTP API routes emit APIError; CLI JSON commands emit CLIProblem.
      oneOf:
        - $ref: "#/components/schemas/APIError"
        - $ref: "#/components/schemas/CLIProblem"
    SnapshotUnavailable:
      type: object
      required: [generated_at, error]
      properties:
        generated_at: {type: string, format: date-time}
        error:
          type: object
          required: [code, message]
          properties:
            code: {type: string, enum: [snapshot_unavailable]}
            message: {type: string}
    IssueExplanation:
      type: object
      description: Version 3 issue state assembled from tracker, runtime, session, pull-request, gate, provenance trust, and cumulative park evidence.
      required: [schema, found, observed_at, identity, current_lane, eligibility, sessions, required_gate, park_summary, sources, evidence]
      properties:
        schema: {type: integer, enum: [3]}
        found: {type: boolean}
        observed_at: {type: string, format: date-time}
        identity: {$ref: "#/components/schemas/IssueExplanationIdentity"}
        current_lane: {$ref: "#/components/schemas/IssueExplanationLane"}
        latest_transition: {$ref: "#/components/schemas/GenericObject"}
        eligibility: {$ref: "#/components/schemas/GenericObject"}
        attempt: {$ref: "#/components/schemas/GenericObject"}
        sessions: {$ref: "#/components/schemas/GenericObject"}
        pull_request: {$ref: "#/components/schemas/GenericObject"}
        required_gate: {$ref: "#/components/schemas/GenericObject"}
        park_summary: {$ref: "#/components/schemas/IssueParkSummary"}
        sources:
          type: array
          items: {$ref: "#/components/schemas/IssueExplanationSource"}
        evidence:
          type: array
          items: {$ref: "#/components/schemas/IssueExplanationEvidence"}
    IssueProgressCredit:
      type: object
      required: [project_id, credited_at]
      properties:
        project_id: {type: string}
        issue_id: {type: string}
        identifier: {type: string}
        issue_url: {type: string, format: uri}
        credited_at: {type: string, format: date-time}
    IssueParkSummary:
      type: object
      required: [attempt_count, park_count, acknowledged_park_sequence, causes, tokens]
      properties:
        attempt_count: {type: integer, format: int64}
        park_count: {type: integer, format: int64}
        acknowledged_park_sequence: {type: integer, format: int64}
        acknowledged_at: {type: string, format: date-time}
        causes:
          type: array
          items: {$ref: "#/components/schemas/IssueParkCauseSummary"}
        tokens: {$ref: "#/components/schemas/IssueParkTokenTotals"}
    IssueParkCauseSummary:
      type: object
      required: [cause, count, first_at, last_at]
      properties:
        cause: {type: string}
        count: {type: integer, format: int64}
        first_at: {type: string, format: date-time}
        last_at: {type: string, format: date-time}
    IssueParkTokenTotals:
      type: object
      required: [input_tokens, cached_input_tokens, output_tokens, reasoning_output_tokens]
      properties:
        input_tokens: {type: integer, format: int64}
        cached_input_tokens: {type: integer, format: int64}
        output_tokens: {type: integer, format: int64}
        reasoning_output_tokens: {type: integer, format: int64}
    IssueExplanationIdentity:
      type: object
      required: [project_id]
      properties:
        project_id: {type: string}
        issue_id: {type: string}
        identifier: {type: string}
        issue_url: {type: string, format: uri}
        number: {type: integer}
        title: {type: string}
    IssueExplanationLane:
      type: object
      required: [freshness, degraded]
      properties:
        name: {type: string}
        observed_at: {type: string, format: date-time}
        freshness: {$ref: "#/components/schemas/IssueExplanationSourceState"}
        degraded: {type: boolean}
        evidence_id: {type: string}
    IssueExplanationSource:
      type: object
      required: [name, state]
      properties:
        name: {type: string}
        state: {$ref: "#/components/schemas/IssueExplanationSourceState"}
        code: {type: string}
    IssueExplanationEvidence:
      type: object
      required: [id, kind]
      properties:
        id: {type: string}
        kind:
          type: string
          enum: [snapshot, workflow, attempt, scheduler, admission, session, provider_session, pull_request]
        observed_at: {type: string, format: date-time}
    IssueExplanationSourceState:
      type: string
      enum: [available, live, last_known, expired, unavailable, corrupt]
    State:
      type: object
      required: [generated_at, snapshot_age_seconds, status, shutdown, instance, projects, stats, board]
      properties:
        generated_at: {type: string, format: date-time}
        snapshot_age_seconds: {type: integer, format: int64, minimum: 0}
        status: {type: string, enum: [running, draining]}
        shutdown: {$ref: "#/components/schemas/GenericObject"}
        instance: {$ref: "#/components/schemas/GenericObject"}
        projects:
          type: array
          items: {$ref: "#/components/schemas/GenericObject"}
        stats: {$ref: "#/components/schemas/GenericObject"}
        board: {$ref: "#/components/schemas/GenericObject"}
      additionalProperties: true
    TimeSeries:
      type: object
      description: Bucketed time-series response; metric arrays evolve additively.
      additionalProperties: true
    WorkItemRequest:
      type: object
      required: [title, description]
      properties:
        title: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        state: {type: string}
        labels:
          type: array
          items: {type: string}
        fields:
          type: object
          additionalProperties: {type: string}
        priority: {type: integer}
        model_override: {type: string}
        deliverable: {$ref: "#/components/schemas/GenericObject"}
        identifier: {type: string}
    WorkItem:
      type: object
      required: [id, identifier, url]
      properties:
        id: {type: string}
        identifier: {type: string}
        number: {type: integer}
        url: {type: string, format: uri}
    WorkAttempt:
      type: object
      required: [attempt_id, receipt_url, recovery_url]
      properties:
        attempt_id: {type: integer, format: int64}
        project_id: {type: string}
        issue_id: {type: string}
        identifier: {type: string}
        status: {type: string}
        receipt_url: {type: string}
        recovery_url: {type: string}
      additionalProperties: true
    RecoveryRequest:
      type: object
      required: [action, confirm]
      properties:
        action: {type: string}
        confirm: {type: boolean}
        reason: {type: string}
        operator: {type: string}
    StopRunRequest:
      type: object
      required: [issue_id, confirm]
      properties:
        issue_id: {type: string}
        work_attempt_id: {type: integer, format: int64}
        detent_session_id: {type: integer, format: int64}
        provider_session_id: {type: string}
        destination: {type: string}
        priority: {type: integer}
        reason: {type: string}
        confirm: {type: boolean}
    SecurityAuditDispositionRequest:
      type: object
      required: [repository, pull_request, base_sha, head_sha, finding_id, status, evidence, confirm]
      properties:
        repository: {type: string, minLength: 1}
        pull_request: {type: integer, minimum: 1}
        base_sha: {type: string, minLength: 1}
        head_sha: {type: string, minLength: 1}
        finding_id: {type: string, minLength: 1}
        status: {type: string, enum: [false_positive]}
        evidence: {type: string, minLength: 1, maxLength: 16384}
        confirm: {type: boolean}
    SecurityAuditDisposition:
      type: object
      required: [id, audit_run_id, finding_id, status, evidence, service_identity, recorded_at]
      properties:
        id: {type: integer, format: int64}
        audit_run_id: {type: integer, format: int64}
        finding_id: {type: string}
        status: {type: string, enum: [false_positive]}
        evidence: {type: string}
        service_identity: {type: string}
        recorded_at: {type: string, format: date-time}
    APIKey:
      type: object
      required: [id, name, prefix_last4, scopes, project_ids, status, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        prefix_last4: {type: string}
        scopes:
          type: array
          items: {type: string, enum: [read, write, admin]}
        project_ids:
          type: array
          items: {type: string}
        status: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    APIKeyList:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items: {$ref: "#/components/schemas/APIKey"}
    APIKeyCreateRequest:
      type: object
      required: [name, scopes]
      properties:
        name: {type: string}
        scopes:
          type: array
          items: {type: string, enum: [read, write, admin]}
        project_ids:
          type: array
          items: {type: string}
        expires_in: {type: string, example: 90d}
    APIKeyCreated:
      type: object
      required: [key, token]
      properties:
        key: {$ref: "#/components/schemas/APIKey"}
        token:
          type: string
          description: Returned once. Store it securely; it cannot be retrieved later.
    Refresh:
      type: object
      required: [queued, coalesced, refused, requested_at, operations]
      properties:
        request_id: {type: string}
        status: {type: string}
        queued: {type: boolean}
        coalesced: {type: boolean}
        refused: {type: boolean}
        requested_at: {type: string, format: date-time}
        last_error: {type: string}
        last_error_at: {type: string, format: date-time}
        retry_at: {type: string, format: date-time}
        operations:
          type: array
          items: {type: string}
    Status:
      type: object
      additionalProperties: true
    IntakeResult:
      type: object
      required: [created, matched, source]
      properties:
        issue: {$ref: "#/components/schemas/GenericObject"}
        created: {type: boolean}
        matched: {type: boolean}
        source: {type: string}
    KanbanCommentRequest:
      type: object
      required: [project_id, target, body]
      properties:
        project_id: {type: string}
        target: {type: string, enum: [issue, pr]}
        issue_id: {type: string}
        pr_repository: {type: string}
        pr_number: {type: integer}
        body: {type: string}
    KanbanCommentMutation:
      type: object
      required: [project_id, issue_id, comment_id]
      properties:
        project_id: {type: string}
        issue_id: {type: string}
        comment_id: {type: string}
        body: {type: string}
