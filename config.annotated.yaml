# Use the GitHub issue-label status source when a project does not use
# ProjectV2 or a custom issue Status field.
tracker:
  kind: github
  api_key: replace-with-a-github-token
  github_status_source: label
  repository: example/example
  status_label_prefix: "detent:"
  active_states:
    - Todo
    - In Progress
    - Rework
    - Merging
  observed_states:
    - Backlog
    - Human Review
    - Blocked
  terminal_states:
    - Done
    - Cancelled
  state_map:
    Backlog: Backlog
    Todo: Todo
    In Progress: In Progress
    Human Review: Human Review
    Rework: Rework
    Merging: Merging
    Done: Done
    Cancelled: Done

# Keep worktrees outside the source checkout. The isolated cache strategy
# prevents mutable build state from leaking between concurrent agents.
workspace:
  kind: local_git
  root: /var/tmp/detent-workspaces
  cache_strategy: isolated
  auto_branch: true

# Use a separate bot-user token for worker gh/curl calls. A second token for
# the orchestrator's GitHub user still shares its REST budget and is rejected.
worker:
  github_token: $DETENT_WORKER_GITHUB_TOKEN
  github_rest_min_remaining_reserve: 1000
  github_rest_poll_interval_ms: 60000

# Bound fleet concurrency globally and serialize only the merge lane.
agent:
  max_concurrent_agents: 4
  max_concurrent_agents_by_state:
    Merging: 1
  auto_promote:
    enabled: true
    source_state: Human Review
    pass_state: Merging
    rework_state: Rework
    quiet_seconds: 600
    optout_label: requires-human-review

# The command gate runs in the isolated worktree. Automated review remains a
# required independent signal before automatic promotion.
gate:
  kind: command
  run: make check
  automated_review: required

# Hooks are trusted commands. This example only installs dependencies after a
# new worktree is created.
hooks:
  after_create: go mod download
