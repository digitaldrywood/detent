# Standalone syntax/TLS-file check; never start nginx with this file.
# Place the production, staging and connection examples at the .next paths below,
# then run nginx -t -c with this file's installed path.
error_log stderr;
events {}
http {
    include /etc/nginx/conf.d/00-bot-block.conf;
    include /etc/nginx/sites-available/detent-cloud-connection.conf.next;
    include /etc/nginx/sites-available/detent-cloud-production.conf.next;
    include /etc/nginx/sites-available/detent-cloud-staging.conf.next;
}
