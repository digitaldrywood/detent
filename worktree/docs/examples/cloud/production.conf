# Example nginx ingress for a shared entry (detent cloud serve) on loopback port 8017.
# The entry and tenant public_url must match the served origin; the second server
# pair keeps a legacy origin routed to the same entry.
server {
    listen 80;
    server_name cloud.example.com;
    return 308 https://cloud.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name cloud.example.com;
    ssl_certificate /etc/letsencrypt/live/cloud.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cloud.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Site-wide security snippet; runner API rate limiting remains disabled.
    include /etc/nginx/snippets/security-default.conf;
    client_max_body_size 100m;

    # The entry decides which browser navigations to redirect. Keep the legacy
    # Host for callback cookies and same-origin checks, and every URI/body intact.
    location / {
        proxy_pass http://127.0.0.1:8017;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $detent_cloud_connection;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}

server {
    listen 80;
    server_name legacy.example.com;
    return 308 https://legacy.example.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name legacy.example.com;
    ssl_certificate /etc/letsencrypt/live/legacy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/legacy.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    # Site-wide security snippet; runner API rate limiting remains disabled.
    include /etc/nginx/snippets/security-default.conf;
    client_max_body_size 100m;

    # The entry decides which browser navigations to redirect. Keep the legacy
    # Host for callback cookies and same-origin checks, and every URI/body intact.
    location / {
        proxy_pass http://127.0.0.1:8017;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $detent_cloud_connection;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
