name: Set up Go with a rolling build cache
description: Restore the newest module and build cache for this job and save a fresh one after every run
inputs:
  key:
    description: Job-specific cache namespace
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v6
      with:
        go-version: '1.26.6'
        cache: false
    - uses: actions/cache@v5
      with:
        path: |
          ~/go/pkg/mod
          ~/.cache/go-build
        key: go-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}
        restore-keys: |
          go-${{ runner.os }}-${{ inputs.key }}-${{ hashFiles('go.sum') }}-
          go-${{ runner.os }}-${{ inputs.key }}-
