name: Visual baselines

on:
  workflow_dispatch:
    inputs:
      specs:
        description: Space-separated spec paths under tests/visual (empty regenerates every changed baseline)
        required: false
        type: string
        default: ''

permissions:
  contents: read

jobs:
  update:
    name: Regenerate changed baselines on Linux
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.61.0-noble
      options: --ipc=host
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install build tools and UI fonts
        run: apt-get update && apt-get install -y --no-install-recommends make gcc libc6-dev fonts-dejavu-core

      - name: Install Node dependencies
        run: npm ci

      - name: Build Detent visual test binary
        run: make build

      - name: Regenerate changed baselines
        shell: bash
        env:
          DETENT_BINARY: ${{ github.workspace }}/tmp/detent
          TMPDIR: ${{ runner.temp }}
          DETENT_VISUAL_STRICT: '1'
          SPECS: ${{ inputs.specs }}
        run: |
          set -uo pipefail
          # shellcheck disable=SC2086
          npx playwright test --update-snapshots=changed $SPECS || true
          git status --porcelain tests/visual/__screenshots__ | tee "$RUNNER_TEMP/visual-baselines-changed.txt"
          git diff --stat tests/visual/__screenshots__ || true

      - name: Upload regenerated baselines
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines
          path: |
            tests/visual/__screenshots__
            ${{ runner.temp }}/visual-baselines-changed.txt
          if-no-files-found: error
          retention-days: 7
