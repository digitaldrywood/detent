name: CI

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      fail_job:
        description: Force one job to fail after its normal checks
        required: false
        type: choice
        default: none
        options: [none, verify-fast]

permissions:
  contents: read

concurrency:
  group: scheduled-develop-validation
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.scope.outputs.should_run }}
      develop_sha: ${{ steps.scope.outputs.develop_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - id: scope
        shell: bash
        run: |
          set -euo pipefail
          develop_sha="$(git ls-remote origin refs/heads/develop | cut -f1)"
          test -n "$develop_sha"
          echo "develop_sha=$develop_sha" >> "$GITHUB_OUTPUT"
          echo should_run=true >> "$GITHUB_OUTPUT"

  invariants:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    name: Invariant Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.develop_sha }}
      - uses: ./.github/actions/prepare-conversation

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Exercise required invariant behaviors
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence invariants make check-invariants

  lint:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.develop_sha }}

      - uses: ./.github/actions/prepare-conversation

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Cache golangci-lint
        uses: actions/cache@v5
        with:
          path: tmp/tools/golangci-lint
          key: golangci-lint-${{ runner.os }}-go1.26.6-${{ hashFiles('.golangci-version') }}

      - name: Cache golangci-lint analysis
        uses: actions/cache@v5
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-analysis-${{ runner.os }}-${{ hashFiles('.golangci.yml', 'go.sum') }}
          restore-keys: |
            golangci-lint-analysis-${{ runner.os }}-

      - name: Run golangci-lint
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence lint make lint

  verify-fast:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    name: Verify build and vet
    runs-on: ubuntu-latest
    # Allow the 30m workspace suite plus other packages, setup, and evidence upload.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.develop_sha }}
          fetch-depth: 0

      - uses: ./.github/actions/prepare-conversation

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Generate documentation and verify committed SQL sources
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence generated make check-generated

      - name: Verify Cloud client sources and generated assets
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence app make check-app

      - name: Check integrated migration versions
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence migrations make check-migrations

      - name: Download modules
        run: go mod download

      - name: Build
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence build go build ./...

      - name: Vet
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence vet make vet

      - name: Audit all Go packages with NilAway and the reviewed baseline
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          python3 -m unittest scripts/nilaway_changed_test.py
          source scripts/check-evidence.sh
          check_with_evidence nilaway-changed make nilaway-changed

      - name: Test
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence unit-full make test

      - name: Force acceptance probe failure
        if: github.event_name == 'workflow_dispatch' && inputs.fail_job == 'verify-fast'
        run: exit 1

      - name: Upload workspace test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-test-evidence-${{ runner.os }}
          path: tmp/workspace-test-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Repeat subprocess lifecycle readiness
        run: go test -race ./internal/claudecode ./internal/codex -run '^(TestRunTurnCancellationKillsChildProcessGroup|TestRunTurnDetectsExitedParentWithInheritedStdout|TestLocalTransportCloseKillsChildProcessGroup|TestLocalTransportReapsChildAfterParentExits)$' -count=20 -timeout=5m

  verify-race:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    name: Verify race
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.develop_sha }}
      - uses: ./.github/actions/prepare-conversation

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true
      - name: Race test the short unit suite
        run: |
          source scripts/check-evidence.sh
          check_with_evidence race make test-race

  test-cover:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    name: Test Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.develop_sha }}

      - uses: ./.github/actions/prepare-conversation

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Check coverage
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence coverage make test-cover

  security:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.develop_sha }}

      - uses: ./.github/actions/prepare-conversation

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Run govulncheck and gosec
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence security make security

  browser-visual-shard:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    name: Browser Visual (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.develop_sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build Detent visual test binary
        run: make build

      - name: Run full browser visual gate
        env:
          DETENT_BINARY: ${{ github.workspace }}/tmp/detent
          TMPDIR: ${{ runner.temp }}
        run: npm run test:visual -- --shard=${{ matrix.shard }}/3

      - name: Upload browser visual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-visual-evidence-${{ matrix.shard }}
          path: |
            tmp/playwright-evidence
            ${{ runner.temp }}/playwright-evidence
          if-no-files-found: ignore
          retention-days: 14

      # Successful retries still contain failed-attempt diagnostics.
      - name: Upload browser visual failure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-visual-failure-artifacts-${{ matrix.shard }}
          path: |
            tmp/playwright-report
            tmp/playwright-results
          if-no-files-found: ignore
          retention-days: 14

  portability-verify:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    name: Portability Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Allow the 30m workspace suite plus other packages, setup, and evidence upload.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.develop_sha }}

      - uses: ./.github/actions/prepare-conversation

      - name: Set up Go (uncached on macOS)
        uses: actions/setup-go@v6
        timeout-minutes: 3
        with:
          go-version: '1.26.6'
          cache: false

      - name: Download modules
        run: go mod download

      - name: Build
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence build go build ./...

      - name: Vet
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence vet make vet

      - name: Test the short unit suite
        shell: bash
        run: |
          source scripts/check-evidence.sh
          check_with_evidence unit-short make test-fast

      - name: Upload workspace test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-test-evidence-${{ runner.os }}
          path: tmp/workspace-test-evidence
          if-no-files-found: warn
          retention-days: 14

  installer-smoke:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    name: Installer Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.develop_sha }}

      - name: Resolve release installer version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(bash ./scripts/resolve-release-tag.sh)"
          echo "DETENT_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Smoke release installer
        shell: bash
        run: |
          set -euo pipefail
          export DETENT_INSTALL_DIR="$RUNNER_TEMP/detent/bin"
          export DETENT_STATE_DIR="$RUNNER_TEMP/detent/state"
          export DETENT_INSTALL_LOCK="$DETENT_STATE_DIR/install.lock"
          export DETENT_INSTALL_MODE=release

          output="$(sh ./install.sh 2>&1)"
          printf '%s\n' "$output"
          if grep -Fq "falling back to prepared source" <<< "$output"; then
            echo "Release installer fell back to prepared source" >&2
            exit 1
          fi
          grep -F "Verified checksum for detent_" <<< "$output"
          grep -F "Installed Detent at $DETENT_INSTALL_DIR/detent" <<< "$output"
          grep -F "Add $DETENT_INSTALL_DIR to PATH before running detent" <<< "$output"

          test -x "$DETENT_INSTALL_DIR/detent"
          grep -F "binary=$DETENT_INSTALL_DIR/detent" "$DETENT_INSTALL_LOCK"
          grep -F "installed_at=" "$DETENT_INSTALL_LOCK"

          "$DETENT_INSTALL_DIR/detent" version

  goreleaser-snapshot:
    needs: preflight
    if: needs.preflight.outputs.should_run == 'true'
    name: GoReleaser Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.develop_sha }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/conversation/package-lock.json

      - name: Prepare non-published snapshot provenance fixture
        env:
          CI_DEVELOP_SHA: ${{ needs.preflight.outputs.develop_sha }}
        run: |
          mkdir -p tmp
          printf '{"schema":1,"repository":"%s","tag":"snapshot","commit":"%s","checks":[{"name":"snapshot packaging only","status":"completed","conclusion":"success"}]}\n' "$GITHUB_REPOSITORY" "$CI_DEVELOP_SHA" > tmp/detent_release_provenance.json

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=sign
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  finalize:
    name: Finalize scheduled validation
    timeout-minutes: 5
    needs: [preflight, invariants, lint, verify-fast, verify-race, test-cover, security, browser-visual-shard, portability-verify, installer-smoke, goreleaser-snapshot]
    if: always() && (needs.preflight.outputs.should_run == 'true' || needs.preflight.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      issues: write
      statuses: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.preflight.outputs.develop_sha }}
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: false
      - name: Report source blockers at High and publish validated tag
        env:
          GH_TOKEN: ${{ github.token }}
          CI_DEVELOP_SHA: ${{ needs.preflight.outputs.develop_sha }}
          TMPDIR: ${{ runner.temp }}
          DETENT_MCP_URL: https://cloud.detent.build/organizations/org_9e0e65eec07a6639979a/mcp
          DETENT_PROJECT_ID: prj_6d4919bebd73446798e6cd807feda10e
          DETENT_API_KEY: ${{ secrets.DETENT_API_KEY }}
        run: bash scripts/scheduled-ci-finish.sh
      - name: Retain scheduled reporting evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scheduled-reporting-evidence
          path: ${{ runner.temp }}/scheduled-ci-*
          if-no-files-found: warn
          retention-days: 14
