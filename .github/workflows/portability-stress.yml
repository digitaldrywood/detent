name: Portability Stress

on:
  schedule:
    - cron: '41 10 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability-stress:
    name: Portability Stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.6'
          cache: true

      - name: Download modules
        run: go mod download

      - name: Stress local SQLite artifact lifecycle
        if: runner.os == 'Windows'
        run: go test ./internal/orchestrator -run '^TestLocalSQLiteArtifactLifecycleEndToEnd$' -count=20

      - name: Stress timing-sensitive packages
        run: go test -race ./internal/cli ./internal/runner ./tools/checklock -count=10 -timeout=30m

      - name: Race test
        shell: bash
        run: |
          bash scripts/test-workspace.sh -race -output tmp/workspace-race-evidence
          go list ./... > tmp/stress-packages.txt
          packages=()
          while IFS= read -r package; do
            if [ "$package" != github.com/digitaldrywood/detent/internal/workspace ]; then
              packages+=("$package")
            fi
          done < tmp/stress-packages.txt
          go test -race "${packages[@]}"

      - name: Upload workspace race evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: workspace-race-evidence-${{ runner.os }}
          path: tmp/workspace-race-evidence
          if-no-files-found: warn
          retention-days: 14
